<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="_base.css"><title>Settings</title><style>
header{background:#fff;border-bottom:1px solid #e3e6eb;padding:16px;font-weight:700;font-size:18px}.page{padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f3}.row small{display:block;color:#5b6472}
.t{width:44px;height:26px;border-radius:13px;background:#cdd2da;position:relative;flex:none}.t.on{background:#2457d6}
.t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}.t.on::after{left:21px}
.page .btn{width:100%;text-align:center;margin-top:24px}
</style></head><body><header>Notifications</header><div class="page"><div class="card" style="padding:4px 16px">
<div class="row"><div>Pay run reminders<small>Two days before each run</small></div><div class="t on"></div></div>
<div class="row"><div>Expense approvals<small>When someone submits an expense</small></div><div class="t on"></div></div>
<div class="row"><div>Product news<small>Monthly, no more</small></div><div class="t"></div></div>
<div class="row" style="border:0"><div>Security alerts<small>Always on for admins</small></div><div class="t on"></div></div></div>
<a class="btn" href="#">Save changes</a></div></body></html>
