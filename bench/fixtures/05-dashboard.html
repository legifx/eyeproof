<!doctype html><html><head><meta charset="utf-8"><title>Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#111418;color:#e6e9ee}
.wrap{padding:28px 36px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.k{background:#181c22;border:1px solid #262b33;border-radius:12px;padding:18px}.k span{color:#8b95a3;font-size:13px}.k b{display:block;font-size:30px;margin-top:4px}
.panel{background:#181c22;border:1px solid #262b33;border-radius:12px;padding:20px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:18px;height:180px;padding-top:10px}.bars i{flex:1;background:#9b6bff;border-radius:6px 6px 0 0}
.legend{display:flex;gap:8px;align-items:center;color:#8b95a3;font-size:13px;margin-top:12px}.legend em{width:12px;height:12px;border-radius:3px;background:#2fbf71}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid #262b33;text-align:left}th{color:#8b95a3;font-weight:500}
</style></head><body><div class="wrap"><h2>Overview — October</h2>
<div class="kpis"><div class="k"><span>Revenue</span><b>$84.2k</b></div><div class="k"><span>Active users</span><b style="color:#1d2129">12,408</b></div><div class="k"><span>Churn</span><b>2.1%</b></div><div class="k"><span>NPS</span><b>47</b></div></div>
<div class="panel"><b>Monthly revenue</b><div class="bars"><i style="height:40%"></i><i style="height:52%"></i><i style="height:48%"></i><i style="height:61%"></i><i style="height:70%"></i><i style="height:66%"></i><i style="height:79%"></i><i style="height:92%"></i></div>
<div class="legend"><em></em>Revenue (USD)</div></div>
<div class="panel"><table><tr><th>Customer</th><th>Plan</th><th>MRR</th><th>Owner</th></tr><tr><td>Globex</td><td>Scale</td><td>$4,900</td><td>Priya</td></tr><tr><td>Initech</td><td>Growth</td><td>$2,320</td><td>undefined</td></tr><tr><td>Hooli</td><td>Growth</td><td>$1,740</td><td>Marco</td></tr></table></div>
</div></body></html>
